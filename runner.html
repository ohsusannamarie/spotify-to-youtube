<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><title>Spotify → YouTube Runner</title><style>:root{--bg:#07090d;--panel:#11161e;--line:#2a3441;--text:#f7f9fc;--muted:#93a1b3;--green:#1ed760;--pink:#ff7588;--cyan:#67e8f9;--yellow:#fbbf24}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;background:radial-gradient(circle at 10% -5%,rgba(30,215,96,.14),transparent 30%),var(--bg)}main{max-width:760px;margin:auto;padding:18px 16px 150px}.card{border:1px solid var(--line);background:rgba(17,22,30,.96);border-radius:22px;padding:20px;margin-bottom:12px}.eyebrow{color:var(--green);font-size:11px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}h1{font-size:clamp(34px,10vw,60px);line-height:.95;letter-spacing:-.055em;margin:8px 0 10px}p{color:var(--muted);line-height:1.45}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#0b1016;border:1px solid var(--line);border-radius:13px;padding:11px}.stat b{display:block;font-size:21px}.stat small{font-size:9px;color:var(--muted);text-transform:uppercase}.bar{height:10px;background:#1a212b;border-radius:99px;overflow:hidden;margin-top:12px}.bar div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));width:0}.rank{font-size:11px;color:var(--muted);text-transform:uppercase}.artist{font-size:clamp(38px,12vw,72px);font-weight:950;letter-spacing:-.06em;line-height:.94;margin:5px 0 10px;overflow-wrap:anywhere}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10px}.verified{color:#8bf3ad;border-color:#347c4e}.probable{color:#8ee9ff;border-color:#376d79}.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(7,9,13,0),rgba(7,9,13,.98) 20%);z-index:9}.buttons{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}a,button{font:inherit;border:1px solid var(--line);border-radius:13px;padding:14px 10px;text-decoration:none;text-align:center;color:white;background:#151c26;font-weight:800;cursor:pointer}a{background:rgba(255,117,136,.10);border-color:#70404a;color:#ff9cab}button.done{background:rgba(30,215,96,.13);border-color:#348c54;color:#8bf3ad}.undo{grid-column:1/-1;color:#ffd76d;border-color:#78651f;padding:10px}.queue{display:grid;gap:6px}.row{display:grid;grid-template-columns:45px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);background:#0b1016;border-radius:11px;padding:9px 10px;font-size:12px;cursor:pointer}.row.current{border-color:#3d8d58}.row.finished{opacity:.42}.row small{color:var(--muted)}.history{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.history button{padding:8px 10px;font-size:11px}</style></head><body><main><section class="card"><div class="eyebrow">Human in the loop</div><h1>Spotify → YouTube</h1><p>You click Subscribe. The runner handles queue, progress, skips, corrections, and next artist.</p><div class="stats"><div class="stat"><b id="done">0</b><small>session done</small></div><div class="stat"><b id="left">0</b><small>session left</small></div><div class="stat"><b id="total">0</b><small>total done</small></div></div><div class="bar"><div id="bar"></div></div><button id="new" style="width:100%;margin-top:12px">Build next 75</button></section><section class="card" id="focus"><p>Loading artist data…</p></section><section class="card"><strong>Recent actions</strong><div id="history" class="history"></div></section><section class="card"><strong>Current session</strong><p style="font-size:12px;margin-top:6px">Tap any artist to go back and correct its status.</p><div class="queue" id="queue"></div></section></main><div class="sticky"><div class="buttons"><a id="open" target="_blank" rel="noopener">OPEN YOUTUBE</a><button class="done" id="doneBtn">✓ SUBSCRIBED</button><button id="skip">SKIP</button><button class="undo" id="undo">↶ UNDO LAST</button></div></div><script>let D=[];const KS='s2y_subs_v1',KD='s2y_decisions_v1',KQ='s2y_session_v1',KH='s2y_history_v2';const subs=JSON.parse(localStorage.getItem(KS)||'{}'),dec=JSON.parse(localStorage.getItem(KD)||'{}');let session=JSON.parse(localStorage.getItem(KQ)||'[]'),history=JSON.parse(localStorage.getItem(KH)||'[]'),focus=null;const $=x=>document.getElementById(x);function rows(){return session.map(a=>D.find(x=>x.a===a)).filter(Boolean)}function cur(){if(focus)return D.find(x=>x.a===focus);return rows().find(x=>!subs[x.a]&&dec[x.a]!=='skip')}function save(){localStorage.setItem(KS,JSON.stringify(subs));localStorage.setItem(KD,JSON.stringify(dec));localStorage.setItem(KQ,JSON.stringify(session));localStorage.setItem(KH,JSON.stringify(history.slice(-30)));render()}function build(){session=D.filter(x=>!subs[x.a]&&dec[x.a]!=='skip').slice(0,75).map(x=>x.a);focus=null;save()}function snap(a,action){history.push({a,action,sub:!!subs[a],dec:dec[a]||null})}function act(type){const c=cur();if(!c)return;snap(c.a,type);if(type==='sub'){subs[c.a]=true;dec[c.a]='approved'}else{delete subs[c.a];dec[c.a]='skip'}focus=null;save()}function undo(){const h=history.pop();if(!h)return;if(h.sub)subs[h.a]=true;else delete subs[h.a];if(h.dec===null)delete dec[h.a];else dec[h.a]=h.dec;focus=h.a;save()}function render(){const rs=rows(),c=cur(),dn=rs.filter(x=>subs[x.a]).length,sk=rs.filter(x=>dec[x.a]==='skip').length,total=Object.values(subs).filter(Boolean).length;$('done').textContent=dn;$('left').textContent=Math.max(0,rs.length-dn-sk);$('total').textContent=total;$('bar').style.width=(total/D.length*100)+'%';$('undo').disabled=!history.length;if(!c){$('focus').innerHTML='<div class="rank">Session complete</div><div class="artist">Done.</div><p>Build the next 75 when ready.</p>';$('open').removeAttribute('href')}else{$('focus').innerHTML='<div class="rank">'+(focus?'Editing artist':'Next artist')+' · #'+c.r+'</div><div class="artist"></div><span class="badge '+(c.s==='Verified OAC'?'verified':'probable')+'">'+c.s+'</span><p>'+(subs[c.a]?'Currently marked SUBSCRIBED.':dec[c.a]==='skip'?'Currently marked SKIPPED.':'Ready for action.')+'</p>';$('focus').querySelector('.artist').textContent=c.a;$('open').href=c.u}const h=$('history');h.innerHTML='';history.slice(-5).reverse().forEach(x=>{const b=document.createElement('button');b.textContent=(x.action==='sub'?'✓ ':'↷ ')+x.a;b.onclick=()=>{focus=x.a;render()};h.appendChild(b)});if(!history.length)h.innerHTML='<span style="font-size:12px;color:var(--muted)">No actions yet.</span>';const q=$('queue');q.innerHTML='';rs.forEach(x=>{const r=document.createElement('div');r.className='row'+(c&&c.a===x.a?' current':'')+(subs[x.a]?' finished':'');r.innerHTML='<div>#'+x.r+'</div><div><strong></strong><br><small>'+x.s+'</small></div><div>'+(subs[x.a]?'✓':dec[x.a]==='skip'?'Skip':'')+'</div>';r.querySelector('strong').textContent=x.a;r.onclick=()=>{focus=x.a;render()};q.appendChild(r)})}$('doneBtn').onclick=()=>act('sub');$('skip').onclick=()=>act('skip');$('undo').onclick=undo;$('new').onclick=build;fetch('https://raw.githubusercontent.com/ohsusannamarie/spotify-to-youtube/7b3d0ae96e70ef8c8c4941f7d598b7ff3c35b090/index.html').then(r=>r.text()).then(t=>{const m=t.match(/const D=(\[.*?\]);const KS=/s);if(!m)throw Error('data');D=JSON.parse(m[1]);const jw=D.find(x=>x.a==='Jack White');if(jw)jw.u='https://youtube.com/@jackwhite';if(!session.length)build();else render()}).catch(()=>{$('focus').innerHTML='<div class="artist">Load error</div><p>Refresh the page and try again.</p>'});</script></body></html>
